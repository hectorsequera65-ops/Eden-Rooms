name = "eden-rooms-enet-cron"
main = "worker.mjs"
compatibility_date = "2026-03-10"
workers_dev = false
preview_urls = false

[vars]
ENET_CRON_REF = "integration/enet-cloudflare-preview"
ENET_CRON_PUBLISH = "false"

[triggers]
crons = ["*/5 * * * *"]

[[durable_objects.bindings]]
name = "DISPATCH_SLOTS"
class_name = "DispatchSlots"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DispatchSlots"]
