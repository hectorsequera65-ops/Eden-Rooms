name: ENet versions
run-name: ${{ inputs.cloudflare_slot && format('ENet Cloudflare slot {0}', inputs.cloudflare_slot) || '' }}

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to Cloudflare Preview after local tests
        type: boolean
        default: false
      cloudflare_slot:
        description: UTC slot in epoch milliseconds (set by the Cloudflare Worker)
        type: string
        default: ''
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

jobs:
  versions:
    if: >-
      (github.event_name != 'schedule' ||
        (github.ref == 'refs/heads/main' && vars.EDEN_ENET_PREVIEW_PUBLISH == 'true' &&
          vars.EDEN_ENET_CRON_SOURCE != 'cloudflare')) &&
      (github.event_name != 'workflow_dispatch' || inputs.cloudflare_slot == '' || (github.run_attempt == 1 &&
        (!inputs.publish || (github.ref == 'refs/heads/main' && vars.EDEN_ENET_CRON_SOURCE == 'cloudflare'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      preview_artifact: ${{ steps.upload-client.outcome == 'success' }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build ENet client and test server
        run: |
          mkdir -p work/enet-actions/deps work/enet-actions/apt/lists/partial
          cd work/enet-actions
          apt_options=(-o "Dir::State::lists=$PWD/apt/lists" -o Dir::Etc::parts=-)
          apt-get "${apt_options[@]}" update
          apt-get "${apt_options[@]}" download libenet-dev libenet7
          for package in ./*.deb; do dpkg-deb -x "$package" deps; done
          enet_lib="deps/usr/lib/$(cc -print-multiarch)"
          cc -O2 -Wall -Wextra -Werror -Ideps/usr/include ../../backend/enet/client.c \
            -L"$enet_lib" -Wl,-rpath,"\$ORIGIN/$enet_lib" -lenet -o eden-collector
          cc -O2 -Wall -Wextra -Werror -Ideps/usr/include ../../tests/enet_mock.c \
            -L"$enet_lib" -Wl,-rpath,"\$ORIGIN/$enet_lib" -lenet -o enet-mock

      - name: Run local tests
        run: |
          export EDEN_TEST_CLIENT="$PWD/work/enet-actions/eden-collector"
          export EDEN_TEST_SERVER="$PWD/work/enet-actions/enet-mock"
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.mjs

      - name: Archive tested ENet client and runtime
        id: archive-client
        if: >-
          github.ref == 'refs/heads/main' &&
          vars.EDEN_ENET_PREVIEW_PUBLISH == 'true' &&
          ((github.event_name == 'schedule' && vars.EDEN_ENET_CRON_SOURCE != 'cloudflare') ||
            (github.event_name == 'workflow_dispatch' && inputs.publish == true &&
              (inputs.cloudflare_slot == '' ||
                (github.run_attempt == 1 && vars.EDEN_ENET_CRON_SOURCE == 'cloudflare'))))
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            exit 0
          fi
          cd work/enet-actions
          tar -chf collector.tar eden-collector "deps/usr/lib/$(cc -print-multiarch)"/libenet.so.7
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Upload tested ENet client
        id: upload-client
        if: steps.archive-client.outputs.ready == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: enet-client
          path: work/enet-actions/collector.tar
          if-no-files-found: error
          retention-days: 1

  publish-preview:
    needs: versions
    if: >-
      needs.versions.outputs.preview_artifact == 'true' &&
      github.ref == 'refs/heads/main' &&
      vars.EDEN_ENET_PREVIEW_PUBLISH == 'true' &&
      ((github.event_name == 'schedule' && vars.EDEN_ENET_CRON_SOURCE != 'cloudflare') ||
        (github.event_name == 'workflow_dispatch' && inputs.publish == true &&
          (inputs.cloudflare_slot == '' || (github.run_attempt == 1 && vars.EDEN_ENET_CRON_SOURCE == 'cloudflare'))))
    environment: enet-preview
    concurrency:
      group: enet-versions-preview
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: enet-client
      - name: Publish public room versions to Cloudflare Preview
        env:
          ENET_PREVIEW_API_KEY: ${{ secrets.ENET_PREVIEW_API_KEY }}
        run: |
          tar -xf collector.tar
          timeout 210s python3 -u backend/enet/collector.py \
            --base-url 'https://test-enet-versions-sralcer.eden-rooms.pages.dev' \
            --client ./eden-collector --scheduled
